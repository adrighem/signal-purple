name: Release Please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
      release_tag: ${{ steps.release.outputs.tag_name }}
      release_version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create Release Please GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.0.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  release-artifacts:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-artifacts.yml
    with:
      release_sha: ${{ needs.release-please.outputs.release_sha }}
      release_tag: ${{ needs.release-please.outputs.release_tag }}
      release_version: ${{ needs.release-please.outputs.release_version }}

  publish-apt-repository:
    needs:
      - release-please
      - release-artifacts
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-artifacts.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: write
    steps:
      - name: Dispatch and await protected APT publication
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.release-please.outputs.release_tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40,64}$'
          printf '%s\n' "$RELEASE_TAG" \
            | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          response="$(
            jq --null-input \
              --arg ref "$DEFAULT_BRANCH" \
              --arg release_sha "$RELEASE_SHA" \
              --arg release_tag "$RELEASE_TAG" \
              '{
                ref: $ref,
                inputs: {
                  release_sha: $release_sha,
                  release_tag: $release_tag
                }
              }' \
              | gh api --method POST \
                  --header 'Accept: application/vnd.github+json' \
                  --header 'X-GitHub-Api-Version: 2026-03-10' \
                  --input - \
                  "repos/$GITHUB_REPOSITORY/actions/workflows/apt-repository.yml/dispatches"
          )"
          run_id="$(
            jq -er '.workflow_run_id | numbers | select(. > 0)' \
              <<< "$response"
          )"
          while true; do
            run="$(
              gh api \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
            )"
            jq --exit-status \
              --arg branch "$DEFAULT_BRANCH" \
              --argjson id "$run_id" \
              '.id == $id
                and .event == "workflow_dispatch"
                and .head_branch == $branch
                and (.path | split("@")[0])
                  == ".github/workflows/apt-repository.yml"' \
              <<< "$run" > /dev/null
            status="$(jq -er '.status | strings' <<< "$run")"
            if [ "$status" = completed ]; then
              conclusion="$(jq -er '.conclusion | strings' <<< "$run")"
              if [ "$conclusion" != success ]; then
                printf 'APT publication failed: %s\n' "$conclusion" >&2
                exit 1
              fi
              break
            fi
            case "$status" in
              in_progress | pending | queued | requested | waiting) ;;
              *)
                printf 'unexpected APT publication status: %s\n' \
                  "$status" >&2
                exit 1
                ;;
            esac
            sleep 10
          done

  cleanup-failed-release:
    needs:
      - release-please
      - release-artifacts
    if: ${{ always() && needs.release-please.outputs.release_created == 'true' && needs.release-artifacts.result != 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Create cleanup GitHub App token
        id: cleanup-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.0.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Remove failed draft release and tag
        env:
          EXPECTED_COMMIT: ${{ needs.release-please.outputs.release_sha }}
          GH_TOKEN: ${{ steps.cleanup-app-token.outputs.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.release_tag }}
        run: |
          set -euo pipefail
          get_release_json()
          {
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq -sce --arg tag "$RELEASE_TAG" '
                  [add[] | select(.tag_name == $tag)]
                  | if length == 1 then
                      .[0]
                    elif length == 0 then
                      empty
                    else
                      error("multiple releases use the requested tag")
                    end
                '
          }
          release_json="$(
            get_release_json
          )"
          if [ "$(jq -r '.draft' <<<"$release_json")" != true ]; then
            printf 'refusing to delete published release: %s\n' \
              "$RELEASE_TAG" >&2
            exit 1
          fi
          ref_json="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
          )"
          test "$(jq -r '.object.type' <<<"$ref_json")" = commit
          test "$(jq -r '.object.sha' <<<"$ref_json")" = "$EXPECTED_COMMIT"
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes \
            --repo "$GITHUB_REPOSITORY"
